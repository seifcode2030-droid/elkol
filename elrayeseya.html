<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الكيمياء</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:linear-gradient(135deg,#06121f,#091d2d,#10253a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:1000px;
    text-align:center;
}

h1{
    font-size:3rem;
    margin-bottom:15px;
    color:#00e5ff;
}

.subtitle{
    color:#9fdcff;
    margin-bottom:50px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:40px 20px;
    transition:0.3s;
    backdrop-filter:blur(12px);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    border-color:#00e5ff;
    box-shadow:0 0 25px #00e5ff55;
}

.icon{
    font-size:80px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:10px;
    color:#00e5ff;
}

.card p{
    color:#cfd9e4;
}

.back-btn{
    margin-top:40px;
    display:inline-block;
    padding:12px 25px;
    border-radius:15px;
    text-decoration:none;
    color:white;
    background:#00a6ff;
}
</style>

</head>
<body>

<div class="container">

    <h1>🧪 قسم الكيمياء</h1>
    <p class="subtitle">اختر ما تريد استكشافه</p>

    <div class="cards">

        <a href="main.html" class="card">
            <div class="icon">🧪</div>
            <h2>مختبر التجارب</h2>
            <p>إجراء التفاعلات الكيميائية ومشاهدة النتائج بشكل تفاعلي.</p>
        </a>

        <a href="atom.html" class="card">
            <div class="icon">⚛️</div>
            <h2>الذرة</h2>
            <p>استكشاف الذرات والعناصر والبروتونات والإلكترونات.</p>
        </a>

    </div>

    <a href="../index.html" class="back-btn">⬅ العودة للرئيسية</a>

</div>

</body>
</html>
